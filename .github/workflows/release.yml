name: Release

on:
  push:
    branches:
      - master
    paths:
      - IcarusProfileMod.csproj
      - publish.ps1
      - "**/*.cs"
      - data/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          $project = [xml](Get-Content -LiteralPath .\IcarusProfileMod.csproj)
          $version = $project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Could not read <Version> from IcarusProfileMod.csproj."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "asset=IcarusProfileMod-v$version-win-x64.zip" >> $env:GITHUB_OUTPUT

      - name: Ensure version tag
        id: tag
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          git fetch --tags origin

          $tagCommit = git rev-parse "$tag^{commit}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Tag $tag already exists at $tagCommit; building the release from that tag."
            "release_enabled=true" >> $env:GITHUB_OUTPUT
            "release_ref=$tag" >> $env:GITHUB_OUTPUT
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $tag -m "Icarus Profile Mod $tag" $env:GITHUB_SHA
          git push origin $tag
          "release_enabled=true" >> $env:GITHUB_OUTPUT
          "release_ref=$env:GITHUB_SHA" >> $env:GITHUB_OUTPUT

      - name: Checkout release source
        if: steps.tag.outputs.release_enabled == 'true'
        shell: pwsh
        run: git checkout '${{ steps.tag.outputs.release_ref }}'

      - name: Publish app
        if: steps.tag.outputs.release_enabled == 'true'
        shell: pwsh
        run: .\publish.ps1

      - name: Package app
        if: steps.tag.outputs.release_enabled == 'true'
        shell: pwsh
        run: |
          $asset = '${{ steps.version.outputs.asset }}'
          $zipPath = Join-Path $PWD "artifacts\$asset"
          if (Test-Path -LiteralPath $zipPath) {
            Remove-Item -LiteralPath $zipPath
          }

          Compress-Archive `
            -Path (Join-Path $PWD 'artifacts\win-x64\*') `
            -DestinationPath $zipPath `
            -CompressionLevel Optimal

          "ZIP_PATH=$zipPath" >> $env:GITHUB_ENV

      - name: Write release notes
        if: steps.tag.outputs.release_enabled == 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          @"
          Windows x64 self-contained build for Icarus Profile Mod v$version.

          Built automatically from the version in IcarusProfileMod.csproj.
          "@ | Set-Content -LiteralPath .\release-notes.md

      - name: Create or update release
        if: steps.tag.outputs.release_enabled == 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN_VALUE: ${{ github.token }}
          GITEA_TOKEN_VALUE: ${{ secrets.GITEA_TOKEN }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $asset = '${{ steps.version.outputs.asset }}'
          $title = "Icarus Profile Mod $tag"
          $notes = Get-Content -LiteralPath .\release-notes.md -Raw
          $server = $env:GITHUB_SERVER_URL.TrimEnd('/')
          $repo = $env:GITHUB_REPOSITORY
          $encodedAsset = [uri]::EscapeDataString($asset)

          function Invoke-JsonRequest {
            param(
              [string] $Method,
              [string] $Uri,
              [hashtable] $Headers,
              [object] $Body = $null
            )

            if ($null -eq $Body) {
              return Invoke-RestMethod -Method $Method -Uri $Uri -Headers $Headers
            }

            return Invoke-RestMethod `
              -Method $Method `
              -Uri $Uri `
              -Headers $Headers `
              -ContentType 'application/json' `
              -Body ($Body | ConvertTo-Json -Depth 8)
          }

          function Get-ReleaseOrNull {
            param(
              [string] $Uri,
              [hashtable] $Headers
            )

            try {
              return Invoke-RestMethod -Method Get -Uri $Uri -Headers $Headers
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -eq 404) {
                return $null
              }

              throw
            }
          }

          if ($server -match 'github\.com$') {
            if ([string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN_VALUE)) {
              throw "GITHUB_TOKEN was not available."
            }

            $headers = @{
              Authorization = "Bearer $env:GITHUB_TOKEN_VALUE"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
              'User-Agent' = 'icarus-player-mod-release'
            }
            $apiBase = "https://api.github.com/repos/$repo"
            $release = Get-ReleaseOrNull -Uri "$apiBase/releases/tags/$tag" -Headers $headers

            if ($null -eq $release) {
              $release = Invoke-JsonRequest -Method Post -Uri "$apiBase/releases" -Headers $headers -Body @{
                tag_name = $tag
                target_commitish = $tag
                name = $title
                body = $notes
                draft = $false
                prerelease = $false
                make_latest = 'true'
              }
            } else {
              $release = Invoke-JsonRequest -Method Patch -Uri "$apiBase/releases/$($release.id)" -Headers $headers -Body @{
                name = $title
                body = $notes
                draft = $false
                prerelease = $false
                make_latest = 'true'
              }

              $assets = Invoke-RestMethod -Method Get -Uri "$apiBase/releases/$($release.id)/assets" -Headers $headers
              foreach ($existingAsset in @($assets | Where-Object { $_.name -eq $asset })) {
                Invoke-RestMethod -Method Delete -Uri "$apiBase/releases/assets/$($existingAsset.id)" -Headers $headers | Out-Null
              }
            }

            $uploadBase = ($release.upload_url -split '\{\?')[0]
            Invoke-RestMethod `
              -Method Post `
              -Uri "$uploadBase?name=$encodedAsset" `
              -Headers $headers `
              -ContentType 'application/zip' `
              -InFile $env:ZIP_PATH | Out-Null

            Write-Host "Published GitHub release $tag."
            exit 0
          }

          $token = $env:GITEA_TOKEN_VALUE
          if ([string]::IsNullOrWhiteSpace($token)) {
            $token = $env:GITHUB_TOKEN_VALUE
          }
          if ([string]::IsNullOrWhiteSpace($token)) {
            throw "GITEA_TOKEN was not available."
          }

          $headers = @{
            Authorization = "token $token"
            Accept = 'application/json'
          }
          $apiBase = "$server/api/v1/repos/$repo"
          $release = Get-ReleaseOrNull -Uri "$apiBase/releases/tags/$tag" -Headers $headers

          if ($null -eq $release) {
            $release = Invoke-JsonRequest -Method Post -Uri "$apiBase/releases" -Headers $headers -Body @{
              tag_name = $tag
              target_commitish = $tag
              name = $title
              body = $notes
              draft = $false
              prerelease = $false
            }
          } else {
            $release = Invoke-JsonRequest -Method Patch -Uri "$apiBase/releases/$($release.id)" -Headers $headers -Body @{
              name = $title
              body = $notes
              draft = $false
              prerelease = $false
            }

            $assets = Invoke-RestMethod -Method Get -Uri "$apiBase/releases/$($release.id)/assets" -Headers $headers
            foreach ($existingAsset in @($assets | Where-Object { $_.name -eq $asset })) {
              Invoke-RestMethod -Method Delete -Uri "$apiBase/releases/$($release.id)/assets/$($existingAsset.id)" -Headers $headers | Out-Null
            }
          }

          Invoke-RestMethod `
            -Method Post `
            -Uri "$apiBase/releases/$($release.id)/assets?name=$encodedAsset" `
            -Headers $headers `
            -Form @{ attachment = Get-Item -LiteralPath $env:ZIP_PATH } | Out-Null

          Write-Host "Published Gitea release $tag."
